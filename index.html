<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <title>Blender Batch Renderer</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <h1>Blender Batch Renderer 3.0.0</h1>
    <img src="assets/blenderLogo.svg" draggable=false id="blenderLogo"/>
    <div id="mainContainer">
      <p>Where is your Blender source file?</p>
      <div id="blenderSelector">
        <input type="text" id="blenderPath" placeholder="Where is your blender source file?"/>
        <button id="browseButton" class="bbrBtns">Browse</button>
      </div>

      <div id="DragSection">
        <p>Drag and drop your blender files below</p>
        <div id="tableContainer">
          <table>
            <tr>
              <th class="checkFinish">?</th>
              <th class="serialNumber">No.</th>
              <th class="filename">Filename</th>
              <th>Start</th>
              <th>End</th>
            </tr>
            <tbody id="tableTbody">
              <!-- Table content will be dynamically generated -->
            </tbody>
          </table>
        </div>
      </div>
      
      <div id="outPutFolderSelector">
        <input type="text" id="outputPath" placeholder="Set your main output folder here"/>
        <button id="browseButton" class="bbrBtns">Browse</button>
        <button id="openFolderButton" class="bbrBtns">Open</button>
      </div>
      
      <div id="coreSelector">
        <div>Number of cores </div> 
        <input type="number" id="coreInput">
        <input type="checkbox" name="shutdown" value="yes" id="shutCheck"><label for="shutCheck">Shut down my PC after rendering completion</label>
      </div>
      
      <div id="bottomBtns">
        <button class="bbrBtns" id="loadButton">Load</button>
        <button class="bbrBtns" id="saveButton">Save</button>
        <button class="bbrBtns" id="renderButton">Render</button>
        <button class="bbrBtns" id="newButton">New</button>
      </div>
      
      <div id="statusBar">Welcome!</div>
      
      <div id="renderDiv">
        <div id="newRenderDiv">
          <img id="renderPreview" src="assets/preview.svg"/> 
        </div>
        
        <div style="margin-left: 10px;">
          <h4 style="margin: 0;">Details:</h4>
          <h3 id="fileNameDiplay" style="margin: 0;">your_file_name.blend</h3>
          <h1 id="frameNumberDisplay">00000</h1>
          <div id="currentFrame">full/path/of/the/rendered/frame.ext</div>
        </div>
      </div>
    </div>

    <!-- Load the application scripts -->
    <script>
      // Create global app namespace
      window.app = {};
      
      // Initialize the application when DOM is loaded
      document.addEventListener('DOMContentLoaded', () => {
        // Import the required modules
        const FileService = require('./src/renderer/services/FileService');
        const RenderService = require('./src/renderer/services/RenderService');
        const UIService = require('./src/renderer/services/UIService');
        const StorageService = require('./src/renderer/services/StorageService');
        const DialogComponent = require('./src/renderer/components/DialogComponent');
        const TableComponent = require('./src/renderer/components/TableComponent');
        const StatusComponent = require('./src/renderer/components/StatusComponent');
        
        // Initialize services
        window.app.fileService = new FileService();
        window.app.renderService = new RenderService();
        window.app.uiService = new UIService();
        window.app.storageService = new StorageService();
        
        // Initialize components
        window.app.dialogComponent = new DialogComponent(window.app.fileService);
        window.app.tableComponent = new TableComponent(
          document.getElementById('tableTbody'),
          window.app.fileService,
          window.app.renderService
        );
        window.app.statusComponent = new StatusComponent(document.getElementById('statusBar'));
        
        // Set up event listeners
        setupEventListeners();
        
        // Load preferences
        const preferences = window.app.storageService.loadPreferences();
        if (preferences.blenderSource) {
          document.getElementById('blenderPath').value = preferences.blenderSource;
        }
        
        if (preferences.savedBatFile && preferences.savedBatFile !== 'newSlate') {
          window.app.fileService.loadBatDetails(preferences.savedBatFile);
        }
        
        // Initialize UI
        window.app.uiService.initializeUI();
        
        console.log('Application initialized');
      });
      
      // Set up event listeners for UI elements
      function setupEventListeners() {
        // Browse button for Blender executable
        document.getElementById('browseButton').addEventListener('click', () => {
          window.app.dialogComponent.openBlenderFile();
        });
        
        // Browse button for output folder
        document.querySelector('#outPutFolderSelector #browseButton').addEventListener('click', () => {
          window.app.dialogComponent.openOutputFolder();
        });
        
        // Open folder button
        document.getElementById('openFolderButton').addEventListener('click', () => {
          window.app.dialogComponent.showOutputFolder();
        });
        
        // Bottom buttons
        document.getElementById('loadButton').addEventListener('click', () => {
          window.app.fileService.loadBatFile();
        });
        
        document.getElementById('saveButton').addEventListener('click', () => {
          window.app.fileService.saveBatFile();
        });
        
        document.getElementById('renderButton').addEventListener('click', () => {
          window.app.renderService.renderBatch();
        });
        
        document.getElementById('newButton').addEventListener('click', () => {
          window.app.fileService.newSlate();
        });
        
        // Shutdown checkbox
        document.getElementById('shutCheck').addEventListener('click', () => {
          window.app.renderService.updateShutdownOption();
        });
        
        // Core input change
        document.getElementById('coreInput').addEventListener('input', () => {
          window.app.renderService.updateCoreCount();
        });
        
        // Output path change
        document.getElementById('outputPath').addEventListener('input', () => {
          if (document.getElementById('outputPath').value.trim() === '') {
            window.app.uiService.resetOutputPath();
          }
        });
        
        // Drag and drop event listeners
        document.addEventListener('drop', (event) => {
          event.preventDefault();
          event.stopPropagation();
          
          const files = event.dataTransfer.files;
          for (let i = 0; i < files.length; i++) {
            if (files[i].path.endsWith('.blend')) {
              window.app.tableComponent.addBlendFile(files[i].path);
            }
          }
        });
        
        document.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
      }
    </script>
  </body>
</html>
